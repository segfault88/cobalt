[package]
name = "cobalt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytemuck = { version = "1.24.0", features = ["derive"] }
egui-wgpu = "0.33.0"
glam = { version = "0.30.9", features = ["zerocopy", "bytemuck", "approx"] }
gltf = "1.4.1"
glyphon = { git = "https://github.com/grovesNL/glyphon.git" } # support for wgpu 27 is only in git for now
hexasphere = "16.0.0"
log = { version = "0.4.28", features = ["kv"] }
pollster = "0.4.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
wgpu = { version = "27", features = ["wgpu-core"] }
winit = "0.30"
